# Local infra: run `docker compose up -d` to start Qdrant.
services:
  qdrant:
    image: qdrant/qdrant:v1.12.5
    container_name: qdrant
    ports:
      - "6333:6333"   # REST
      - "6334:6334"   # gRPC
    volumes:
      - qdrant_storage:/qdrant/storage
    restart: unless-stopped

  # Optional: run the briefing API itself in Docker
  # (build first: docker compose build api)
  api:
    build: .
    container_name: knowledge-network-api
    env_file: .env
    environment:
      - QDRANT_URL=http://qdrant:6333
    ports:
      - "8080:8080"
    depends_on:
      - qdrant
    profiles: ["app"]

volumes:
  qdrant_storage:
