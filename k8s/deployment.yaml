# The briefing API. Build & push the image first:
#   docker build -t <AWS_ACCOUNT>.dkr.ecr.<REGION>.amazonaws.com/knowledge-network:v1 .
#   docker push  <AWS_ACCOUNT>.dkr.ecr.<REGION>.amazonaws.com/knowledge-network:v1
# Create the secret:
#   kubectl create secret generic llm-keys \
#     --from-literal=OPENAI_API_KEY=... --from-literal=TAVILY_API_KEY=... \
#     --from-literal=LANGSMITH_API_KEY=...
apiVersion: apps/v1
kind: Deployment
metadata:
  name: knowledge-network-api
spec:
  replicas: 2
  selector:
    matchLabels: {app: knowledge-network-api}
  template:
    metadata:
      labels: {app: knowledge-network-api}
    spec:
      containers:
        - name: api
          image: <AWS_ACCOUNT>.dkr.ecr.<REGION>.amazonaws.com/knowledge-network:v1
          ports:
            - {containerPort: 8080}
          env:
            - {name: QDRANT_URL, value: "http://qdrant:6333"}
            - {name: LANGSMITH_TRACING, value: "true"}
            - {name: LANGSMITH_PROJECT, value: "knowledge-network"}
          envFrom:
            - secretRef: {name: llm-keys}
          readinessProbe:
            httpGet: {path: /health, port: 8080}
            initialDelaySeconds: 20
          livenessProbe:
            httpGet: {path: /health, port: 8080}
            initialDelaySeconds: 40
          resources:
            requests: {cpu: 500m, memory: 1Gi}
            limits: {cpu: "2", memory: 3Gi}
---
apiVersion: v1
kind: Service
metadata:
  name: knowledge-network-api
spec:
  type: LoadBalancer
  selector: {app: knowledge-network-api}
  ports:
    - {port: 80, targetPort: 8080}
